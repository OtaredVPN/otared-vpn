name: Build OTARED APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # تنظیم دقیق نسخه جاوا 17 برای جلوگیری از خطای گرادل
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          
      - run: flutter create . --platforms=android --org com.otared.vpn
      
      - run: flutter pub get
      
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: otared-vpn-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
