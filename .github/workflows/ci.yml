name: Build OTARED APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          
      # این دستور به صورت خودکار پوشه و فایل‌های گم‌شده اندروید را می‌سازد
      - run: flutter create . --platforms=android --org com.otared.vpn
      
      - run: flutter pub get
      
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: otared-vpn-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
