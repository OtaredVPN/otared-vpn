name: OTARED VPN CI

on:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true
      - name: Build Android APK cleanly
        run: |
          flutter create --org com.otared --project-name otared_vpn /tmp/build_app
          cp -f pubspec.yaml /tmp/build_app/pubspec.yaml
          cp -rf lib/* /tmp/build_app/lib/
          cd /tmp/build_app
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: otared-vpn-android-apks
          path: /tmp/build_app/build/app/outputs/flutter-apk/*.apk
          
