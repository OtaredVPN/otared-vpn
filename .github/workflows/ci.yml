name: OTARED VPN CI

on:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true
      - name: Generate clean Android project wrapper
        run: |
          flutter create --org com.otared --project-name otared_vpn /tmp/otared_app
          cp -rn /tmp/otared_app/android .
          cp -rn /tmp/otared_app/.metadata . || true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: otared-vpn-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          
